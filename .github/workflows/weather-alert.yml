name: Morning Weather Alert

on:
  # This cron schedule runs the pipeline daily at 2:00 AM UTC (7:30 AM IST)
  schedule:
    - cron: '0 2 * * *'
  # This allows you to click a button on GitHub to test it immediately
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alert Script
        run: python app.py